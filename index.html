<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TongkolBank — Nabung & Investasi Dalam Satu Genggaman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#10254A;
    --ink-soft:#2B3E63;
    --blue:#2E6FF2;
    --blue-deep:#1E52C4;
    --coral:#FF6B4A;
    --coral-deep:#E85536;
    --yellow:#FFCE45;
    --mint:#22B57F;
    --bg:#FBF9F4;
    --white:#FFFFFF;
    --line:#E7E1D3;
    --display: 'Space Grotesk', sans-serif;
    --body: 'Plus Jakarta Sans', sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html{scroll-behavior:smooth;}

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  body{
    font-family:var(--body);
    background:var(--bg);
    color:var(--ink);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }

  img,svg{display:block;max-width:100%;}

  a{color:inherit;text-decoration:none;}

  ul{list-style:none;}

  h1,h2,h3{font-family:var(--display);letter-spacing:-0.01em;color:var(--ink);}

  .container{
    width:100%;
    max-width:1180px;
    margin:0 auto;
    padding:0 24px;
  }

  section{padding:88px 0;}

  :focus-visible{
    outline:3px solid var(--coral);
    outline-offset:3px;
  }

  /* ---------- BUTTONS ---------- */
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-family:var(--body);
    font-weight:700;
    font-size:16px;
    padding:15px 28px;
    border-radius:100px;
    border:2px solid transparent;
    cursor:pointer;
    transition:transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    white-space:nowrap;
  }
  .btn-primary{
    background:var(--coral);
    color:var(--white);
    box-shadow:0 6px 0 var(--coral-deep);
  }
  .btn-primary:hover{transform:translateY(-2px);}
  .btn-primary:active{transform:translateY(2px);box-shadow:0 2px 0 var(--coral-deep);}
  .btn-secondary{
    background:transparent;
    color:var(--ink);
    border-color:var(--ink);
  }
  .btn-secondary:hover{background:var(--ink);color:var(--white);}
  .btn-light{
    background:var(--white);
    color:var(--ink);
  }
  .btn-light:hover{background:var(--yellow);}

  /* ---------- HEADER ---------- */
  header{
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(251,249,244,0.9);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 24px;
  }
  .logo{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:var(--display);
    font-weight:700;
    font-size:20px;
    color:var(--ink);
  }
  .logo .dot{color:var(--coral);}
  .nav-links{
    display:flex;
    align-items:center;
    gap:32px;
  }
  .nav-links a{
    font-weight:600;
    font-size:15px;
    color:var(--ink-soft);
    transition:color 0.15s ease;
  }
  .nav-links a:hover{color:var(--coral);}
  .nav-cta{display:flex;align-items:center;gap:16px;}
  .nav-menu-toggle{display:none;}

  @media (max-width:860px){
    .nav-links{display:none;}
  }

  /* ---------- HERO ---------- */
  .hero{
    padding-top:72px;
    padding-bottom:40px;
    position:relative;
    overflow:hidden;
  }
  .hero-grid{
    display:grid;
    grid-template-columns:1.05fr 0.95fr;
    gap:48px;
    align-items:center;
  }
  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--white);
    border:1px solid var(--line);
    padding:8px 16px;
    border-radius:100px;
    font-size:13px;
    font-weight:700;
    color:var(--blue-deep);
    margin-bottom:24px;
  }
  .eyebrow .pulse{
    width:8px;height:8px;border-radius:50%;background:var(--mint);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1;transform:scale(1);}
    50%{opacity:0.5;transform:scale(1.3);}
  }
  .hero h1{
    font-size:clamp(36px,5.4vw,58px);
    line-height:1.06;
    font-weight:700;
    margin-bottom:22px;
  }
  .hero h1 .hl{color:var(--coral);}
  .hero h1 .hl-blue{color:var(--blue);}
  .hero p.lead{
    font-size:18px;
    color:var(--ink-soft);
    max-width:520px;
    margin-bottom:34px;
  }
  .hero-ctas{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:36px;
  }
  .hero-trust{
    display:flex;
    gap:28px;
    flex-wrap:wrap;
    font-size:13px;
    color:var(--ink-soft);
    font-weight:600;
  }
  .hero-trust span{display:flex;align-items:center;gap:6px;}
  .hero-trust svg{width:16px;height:16px;stroke:var(--mint);}

  /* signature: growth line made of fish */
  .hero-art{
    position:relative;
    background:var(--ink);
    border-radius:28px;
    padding:36px 28px 28px;
    box-shadow:0 24px 60px -20px rgba(16,37,74,0.45);
  }
  .hero-art-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:8px;
  }
  .hero-art-label{color:#B9C6E5;font-size:13px;font-weight:600;}
  .hero-art-value{
    font-family:var(--mono);
    color:var(--white);
    font-size:30px;
    font-weight:600;
  }
  .hero-art-value .up{color:var(--mint);font-size:15px;margin-left:8px;}
  .fish-chart{width:100%;height:auto;margin-top:12px;}
  .hero-art-caption{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
    font-family:var(--mono);
    font-size:11px;
    color:#8195C0;
  }

  @media (max-width:920px){
    .hero-grid{grid-template-columns:1fr;}
    .hero-art{order:-1;}
  }

  /* ---------- SECTION HEADINGS ---------- */
  .section-head{
    max-width:620px;
    margin-bottom:52px;
  }
  .section-head .tag{
    display:inline-block;
    font-size:13px;
    font-weight:800;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--coral);
    margin-bottom:12px;
  }
  .section-head h2{
    font-size:clamp(28px,3.6vw,40px);
    font-weight:700;
    line-height:1.15;
    margin-bottom:14px;
  }
  .section-head p{
    color:var(--ink-soft);
    font-size:16px;
  }

  /* ---------- FEATURES ---------- */
  .features{background:var(--white);}
  .feature-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
  }
  .feature-card{
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:20px;
    padding:28px 24px;
    transition:transform 0.2s ease, box-shadow 0.2s ease;
  }
  .feature-card:hover{
    transform:translateY(-4px);
    box-shadow:0 16px 32px -18px rgba(16,37,74,0.25);
  }
  .feature-icon{
    width:52px;height:52px;
    border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    margin-bottom:20px;
  }
  .feature-icon svg{width:26px;height:26px;}
  .feature-card:nth-child(1) .feature-icon{background:#E4EBFF;}
  .feature-card:nth-child(1) .feature-icon svg{stroke:var(--blue);}
  .feature-card:nth-child(2) .feature-icon{background:#FFE6DE;}
  .feature-card:nth-child(2) .feature-icon svg{stroke:var(--coral);}
  .feature-card:nth-child(3) .feature-icon{background:#FFF3CE;}
  .feature-card:nth-child(3) .feature-icon svg{stroke:#B8860B;}
  .feature-card:nth-child(4) .feature-icon{background:#DDF6EA;}
  .feature-card:nth-child(4) .feature-icon svg{stroke:var(--mint);}
  .feature-card h3{
    font-size:19px;
    font-weight:700;
    margin-bottom:10px;
  }
  .feature-card p{
    font-size:14.5px;
    color:var(--ink-soft);
  }

  @media (max-width:920px){
    .feature-grid{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:560px){
    .feature-grid{grid-template-columns:1fr;}
  }

  /* ---------- TESTIMONI ---------- */
  .testi-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:24px;
  }
  .testi-card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:20px;
    padding:28px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .stars{display:flex;gap:3px;}
  .stars svg{width:16px;height:16px;fill:var(--yellow);stroke:var(--yellow);}
  .testi-quote{font-size:15.5px;color:var(--ink-soft);flex-grow:1;}
  .testi-person{display:flex;align-items:center;gap:12px;}
  .avatar{
    width:44px;height:44px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--display);font-weight:700;font-size:15px;color:var(--white);
  }
  .testi-name{font-weight:700;font-size:14.5px;}
  .testi-role{font-size:13px;color:var(--ink-soft);}

  @media (max-width:920px){
    .testi-grid{grid-template-columns:1fr;}
  }

  /* ---------- TUTORIAL ---------- */
  .tutorial{background:var(--ink);color:var(--white);}
  .tutorial .section-head .tag{color:var(--yellow);}
  .tutorial .section-head h2{color:var(--white);}
  .tutorial .section-head p{color:#C4CEE6;}

  .steps{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:16px;
    position:relative;
  }
  .step{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:18px;
    padding:24px 20px;
    position:relative;
  }
  .step-num{
    font-family:var(--mono);
    font-size:13px;
    color:var(--yellow);
    font-weight:700;
    margin-bottom:14px;
    display:block;
  }
  .step h3{
    color:var(--white);
    font-size:16.5px;
    font-weight:700;
    margin-bottom:8px;
  }
  .step p{
    font-size:13.5px;
    color:#B9C6E5;
  }

  @media (max-width:1000px){
    .steps{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:560px){
    .steps{grid-template-columns:1fr;}
  }

  /* ---------- FAQ ---------- */
  .faq-list{
    max-width:760px;
  }
  .faq-item{
    border-bottom:1px solid var(--line);
    padding:6px 0;
  }
  .faq-item summary{
    cursor:pointer;
    list-style:none;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:18px 4px;
    font-weight:700;
    font-size:16px;
  }
  .faq-item summary::-webkit-details-marker{display:none;}
  .faq-item .plus{
    flex-shrink:0;
    width:26px;height:26px;
    border-radius:50%;
    background:var(--bg);
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:18px;
    font-weight:700;
    color:var(--coral);
    transition:transform 0.2s ease;
  }
  .faq-item[open] .plus{transform:rotate(45deg);}
  .faq-item p{
    padding:0 4px 20px;
    color:var(--ink-soft);
    font-size:15px;
    max-width:640px;
  }

  /* ---------- CTA BAND ---------- */
  .cta-band{
    background:var(--coral);
    border-radius:28px;
    padding:56px 40px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:32px;
    flex-wrap:wrap;
    color:var(--white);
  }
  .cta-band h2{color:var(--white);font-size:clamp(24px,3vw,32px);max-width:480px;}
  .cta-band p{color:rgba(255,255,255,0.85);margin-top:8px;font-size:15px;}

  /* ---------- FOOTER ---------- */
  footer{
    background:var(--ink);
    color:#C4CEE6;
    padding:64px 0 28px;
  }
  .footer-grid{
    display:grid;
    grid-template-columns:1.4fr 1fr 1fr 1fr;
    gap:32px;
    padding-bottom:44px;
    border-bottom:1px solid rgba(255,255,255,0.1);
  }
  .footer-brand .logo{color:var(--white);margin-bottom:14px;}
  .footer-brand p{font-size:14px;max-width:280px;color:#9FADCE;}
  .footer-col h4{
    color:var(--white);
    font-size:14px;
    font-weight:700;
    margin-bottom:16px;
  }
  .footer-col ul li{margin-bottom:10px;}
  .footer-col a{font-size:14px;color:#9FADCE;transition:color 0.15s ease;}
  .footer-col a:hover{color:var(--yellow);}
  .footer-bottom{
    padding-top:28px;
    display:flex;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    font-size:12.5px;
    color:#8195C0;
  }
  .footer-disclaimer{
    max-width:720px;
    line-height:1.6;
  }
  .social{display:flex;gap:12px;}
  .social a{
    width:36px;height:36px;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    display:flex;align-items:center;justify-content:center;
  }
  .social svg{width:16px;height:16px;stroke:var(--white);}
  .social a:hover{background:var(--coral);}

  @media (max-width:860px){
    .footer-grid{grid-template-columns:1fr 1fr;}
  }
  @media (max-width:560px){
    section{padding:60px 0;}
    .footer-grid{grid-template-columns:1fr;}
